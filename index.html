<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuaderno de pádel</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18312c;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}.shell{max-width:1050px;margin:auto;padding:22px}header{background:#133d32;color:white;padding:24px;border-radius:20px;margin-bottom:18px}h1{margin:0 0 7px;font-size:27px}header p{margin:0;color:#cce5d9}.tabs,.categories{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,.filelabel{border:1px solid #cadbd1;border-radius:12px;background:white;color:#174a3b;padding:10px 13px;cursor:pointer;font:inherit}.active{background:#174a3b;color:white}main{background:white;border:1px solid #e0e9e3;border-radius:18px;padding:20px;min-height:350px}h2{margin:5px 0 15px}h3{margin:20px 0 8px}li{margin-bottom:9px;line-height:1.5}.tip{border-left:3px solid #5eab8b;padding:5px 12px;margin:8px 0;background:#f6faf7}.muted{color:#5f776d;font-size:14px}.photo{width:100%;max-height:330px;object-fit:contain;background:#eaf2ec;border-radius:12px;margin:12px 0}.photoGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.photoBox{border:1px solid #e1e8e2;padding:12px;border-radius:14px}.photoBox img{width:100%;height:180px;object-fit:cover;border-radius:10px}.photoBox p{font-size:13px;color:#64786f}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}textarea,input[type=text],input[type=date]{width:100%;padding:11px;border:1px solid #cbd9d0;border-radius:10px;font:inherit}textarea{min-height:85px}label{display:block;margin:12px 0 6px;font-weight:600}input[type=file]{max-width:100%}.entry{padding:12px 0;border-bottom:1px solid #e5eee8}.entry button{padding:5px 9px;font-size:13px}.week{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #e4ece6}.week input{width:20px;height:20px}.notice{padding:12px;background:#eef6f0;border-radius:12px;font-size:14px}.foot{margin:16px 0;font-size:12px;color:#637c6f}a{color:#226b50}</style></head><body><div class="shell"><header><h1>🎾 Mi cuaderno de pádel</h1><p>Técnica, fotos, clases y progreso · Actualizable</p></header><div class="tabs" id="tabs"></div><main id="main"></main><p class="foot">Los cambios se guardan en este navegador. Exporta un respaldo JSON periódicamente; las fotos cargadas se incluyen en él. Si abres el archivo en otro dispositivo, importa ese respaldo.</p></div><script>
const initial={sections:[{id:'volea',name:'Volea',icon:'🎾',tips:['Pala arriba, a la altura de la barbilla.','Preparar anticipadamente y hacer un gesto compacto.','Avanzar el cuerpo con un paso del pie contrario al lado del golpe.','Transferir el peso hacia adelante.','Aplicar un poco de slice; acompañar adelante y en diagonal.','Buscar profundidad y rebote bajo en la pared.','Para pelotas bajas, flexionar rodillas en vez de dejar caer la pala.'],extra:['El slice depende de la cara de la pala y del contacto, no solo de la terminación.','Paralela generalmente más controlada; cruzada permite más margen de cancha.'],photos:[]},{id:'bandeja',name:'Bandeja',icon:'🎯',tips:['Girar el cuerpo hasta quedar prácticamente de lado.','Codo elevado y flexionado unos 90°, bíceps paralelo al piso durante la preparación.','Ganar posición con pies rápidos y pasos de ajuste.','Transferir peso del pie trasero al delantero SIN dar un paso durante el golpe.','Contacto con brazo extendido naturalmente, a la altura de la cabeza o ligeramente arriba.','Acompañar hacia adelante y en diagonal, no solo hacia abajo.','Priorizar la dirección cruzada y conservar la posición de ataque.'],extra:['Evitar bloquear rígidamente el codo.','El objetivo habitual es mantener la red, no necesariamente terminar el punto.'],photos:[]},{id:'posicion',name:'Posicionamiento',icon:'📍',tips:['Posición base de ataque: aproximadamente 3 metros detrás de la red.','Referencia visual del profesor: primer poste lateral de atrás, no el de la puerta.','Ajustar posición a la trayectoria de la pelota y a tu compañero.'],extra:[],photos:[]},{id:'defensa',name:'Defensa y globos',icon:'🛡️',tips:['Se han trabajado salidas de pared, globos y colocación.','Practicar globo alto y profundo para recuperar la red.','Defender con paciencia y priorizar control.'],extra:[],photos:[]},{id:'saque',name:'Saque y resto',icon:'↗️',tips:['Saque trabajado en una clase anterior.','Pendiente de incorporar notas específicas del profesor sobre el resto.'],extra:[],photos:[]},{id:'remate',name:'Remate y víbora',icon:'⚡',tips:['Remate trabajado en clases anteriores.','Primeras víboras practicadas en situaciones de partido.'],extra:[],photos:[]}],classes:[{date:'2026-10-15',title:'Volea y bandeja',desc:'Preparación, transferencia de peso, slice, dirección de golpes y posición de ataque a 3 metros de la red.'},{date:'',title:'Defensa',desc:'Salidas de pared, globos y colocación.'},{date:'',title:'Situaciones de partido',desc:'Posicionamiento, voleas, bandejas y primeras víboras.'},{date:'',title:'Bandeja, remate y saque',desc:'Fundamentos de golpes aéreos y saque.'}],weeks:['Volea y bandeja','Defensa: pared y doble pared','Globos y recuperación de red','Saque, resto y primeros golpes','Víbora y bandeja en movimiento','Transiciones fondo-red','Posicionamiento y táctica de pareja','Situaciones de partido y evaluación'],done:[0]};
let data;try{data=JSON.parse(localStorage.getItem('padel-notes-v1'))||structuredClone(initial)}catch(e){data=structuredClone(initial)}let tab='tecnica',selected='volea';const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('padel-notes-v1',JSON.stringify(data))}catch(e){alert('El navegador no pudo guardar más datos. Exporta un respaldo; quizá las fotos son demasiado grandes.')}}function render(){ $('tabs').innerHTML=[['tecnica','Técnica'],['plan','8 jueves'],['historial','Historial'],['respaldo','Respaldo']].map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="tab='${k}';render()">${n}</button>`).join('');if(tab==='tecnica')tech();else if(tab==='plan')plan();else if(tab==='historial')history();else backup()}
function tech(){let s=data.sections.find(x=>x.id===selected)||data.sections[0];$('main').innerHTML=`<div class="categories">${data.sections.map(x=>`<button class="${selected===x.id?'active':''}" onclick="selected='${x.id}';render()">${x.icon} ${esc(x.name)}</button>`).join('')}</div><h2>${s.icon} ${esc(s.name)}</h2><h3>Notas del profesor</h3>${s.tips.map((t,i)=>`<div class="tip">${esc(t)} <button title="Eliminar nota" onclick="delTip('${s.id}',${i})">×</button></div>`).join('')}<label>Agregar tip del profesor</label><textarea id="newTip" placeholder="Escribe una nueva indicación..."></textarea><div class="controls"><button onclick="addTip('${s.id}')">+ Agregar tip</button></div><h3>Recomendaciones complementarias</h3>${s.extra.map(x=>`<div class="tip">${esc(x)}</div>`).join('')||'<p class="muted">Sin notas adicionales todavía.</p>'}<h3>Referencias visuales de técnica</h3>${({volea:[['Volea: pala alta y preparación','https://everythingpadel.co.uk/wp-content/uploads/2021/05/padel-forehand-volley..jpeg','https://everythingpadel.co.uk/padel-forehand-volley/'],['Volea: paso y transferencia de peso','https://rodriovide.wordpress.com/wp-content/uploads/2019/03/captura-de-pantalla-2019-03-12-a-las-20.51.36.png?w=1200','https://rodriovide.wordpress.com/2019/03/13/como-elegir-la-direccion-en-la-volea-y-no-morir-en-el-intento/']],bandeja:[['Bandeja: contacto alto','https://ukpadel.org/wp-content/uploads/2022/11/image4.jpg.png','https://ukpadel.org/b-bandeja/'],['Bandeja: preparación y transferencia de peso','https://www.padeliq.co/blog/images/bandeja-technique.jpg','https://www.padeliq.co/es/blog/como-mejorar-en-padel']]}[s.id]||[]).map(p=>`<div class="photoBox"><img loading="lazy" src="${p[1]}" alt="${p[0]}"><p>${p[0]}</p><a target="_blank" rel="noopener noreferrer" href="${p[2]}">Fuente de la imagen ↗</a></div>`).join('')?`<div class="photoGrid">${({volea:[['Volea: pala alta y preparación','https://everythingpadel.co.uk/wp-content/uploads/2021/05/padel-forehand-volley..jpeg','https://everythingpadel.co.uk/padel-forehand-volley/'],['Volea: paso y transferencia de peso','https://rodriovide.wordpress.com/wp-content/uploads/2019/03/captura-de-pantalla-2019-03-12-a-las-20.51.36.png?w=1200','https://rodriovide.wordpress.com/2019/03/13/como-elegir-la-direccion-en-la-volea-y-no-morir-en-el-intento/']],bandeja:[['Bandeja: contacto alto','https://ukpadel.org/wp-content/uploads/2022/11/image4.jpg.png','https://ukpadel.org/b-bandeja/'],['Bandeja: preparación y transferencia de peso','https://www.padeliq.co/blog/images/bandeja-technique.jpg','https://www.padeliq.co/es/blog/como-mejorar-en-padel']]}[s.id]||[]).map(p=>`<div class="photoBox"><img loading="lazy" src="${p[1]}" alt="${p[0]}"><p>${p[0]}</p><a target="_blank" rel="noopener noreferrer" href="${p[2]}">Fuente ↗</a></div>`).join('')}</div>`:'<p class="muted">Agregaremos referencias visuales al trabajar esta técnica.</p>'}<p class="muted">Las imágenes de referencia se cargan desde sus sitios originales y requieren conexión a internet.</p><h3>Mis fotos y referencias</h3><p class="muted">Añade fotos de tu profesor, de tus propias posiciones o capturas técnicas. Las imágenes quedan dentro de tu cuaderno local.</p><div class="photoGrid">${s.photos.map((p,i)=>`<div class="photoBox"><img src="${p.src}" alt="${esc(p.caption)}"><p>${esc(p.caption)}</p><button onclick="deletePhoto('${s.id}',${i})">Eliminar foto</button></div>`).join('')}</div><label>Subir foto</label><input type="file" id="photoFile" accept="image/*"><label>Descripción</label><input id="photoCaption" type="text" placeholder="Ej. Preparación de bandeja"><div class="controls"><button onclick="addPhoto('${s.id}')">Añadir foto</button></div><p class="notice">Para ver ejemplos técnicos en imágenes externas: <a target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent('padel '+s.name+' tecnica')}">Buscar fotos de ${esc(s.name)}</a>. Puedes guardar una imagen de referencia y subirla aquí, respetando sus derechos de uso.</p>`}
function addTip(id){let v=$('newTip').value.trim();if(!v)return;data.sections.find(s=>s.id===id).tips.push(v);save();render()}function delTip(id,i){if(!confirm('¿Eliminar esta nota?'))return;data.sections.find(s=>s.id===id).tips.splice(i,1);save();render()}function deletePhoto(id,i){data.sections.find(s=>s.id===id).photos.splice(i,1);save();render()}function addPhoto(id){let f=$('photoFile').files[0];if(!f)return alert('Selecciona una foto.');let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1100/img.width,900/img.height);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);data.sections.find(s=>s.id===id).photos.push({src:c.toDataURL('image/jpeg',.72),caption:$('photoCaption').value||f.name});save();render()};img.src=r.result};r.readAsDataURL(f)}
function plan(){$('main').innerHTML=`<h2>Plan de 8 jueves</h2><p class="muted">Clases semanales + partido los martes. Plan flexible para revisar con tu profesor.</p><p>${data.done.length} de 8 clases completadas</p>${data.weeks.map((w,i)=>`<label class="week"><input type="checkbox" ${data.done.includes(i)?'checked':''} onchange="toggleWeek(${i},this.checked)"><span>Semana ${i+1}: ${esc(w)}</span></label>`).join('')}`}function toggleWeek(i,v){data.done=v?[...new Set([...data.done,i])]:data.done.filter(x=>x!==i);save();render()}
function history(){$('main').innerHTML=`<h2>Historial de clases</h2>${data.classes.map((c,i)=>`<div class="entry"><strong>${esc(c.date||'Fecha no registrada')} · ${esc(c.title)}</strong><p>${esc(c.desc)}</p><button onclick="removeClass(${i})">Eliminar</button></div>`).join('')}<h3>Registrar nueva clase</h3><label>Fecha</label><input type="date" id="date"><label>Tema</label><input type="text" id="title" placeholder="Ej. Globo y salida de pared"><label>Notas</label><textarea id="desc" placeholder="¿Qué trabajaste y qué aprendiste?"></textarea><div class="controls"><button onclick="addClass()">Guardar clase</button></div>`}function addClass(){let title=$('title').value.trim();if(!title)return;data.classes.unshift({date:$('date').value,title,desc:$('desc').value});save();render()}function removeClass(i){if(confirm('¿Eliminar este registro?')){data.classes.splice(i,1);save();render()}}
function backup(){$('main').innerHTML=`<h2>Guardar y recuperar el cuaderno</h2><p>Exporta un archivo JSON con notas, fotos y progreso. Así podrás llevar el cuaderno a otro navegador o compartirlo para futuras actualizaciones.</p><div class="controls"><button onclick="exportData()">⬇ Exportar respaldo JSON</button></div><label>Importar respaldo</label><input type="file" id="importFile" accept="application/json,.json" onchange="importData(this)"><p class="notice">Importar reemplaza el contenido actual. Guarda primero un respaldo si quieres conservarlo.</p>`}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cuaderno_padel_respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.sections)||!Array.isArray(d.classes))throw Error();if(confirm('¿Reemplazar el cuaderno actual con este respaldo?')){data=d;save();tab='tecnica';render()}}catch(e){alert('Archivo de respaldo inválido.')}};r.readAsText(f)}render();</script></body></html>
